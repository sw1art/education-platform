services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/education_db
      - PORT=8000
      - JWT_SECRET=your_jwt_secret
      # - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      # - redis
    networks:
      - custom
    volumes:
      - ./backend:/app
      - ./app/alembic/versions:/app/alembic/versions # Ensure migrations are up-to-date

  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - custom
      
